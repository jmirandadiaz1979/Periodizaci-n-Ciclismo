<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>Periodización Ciclismo</title>
<style>
:root{--bg:#0b0f17;--card:#141c2b;--card2:#1a2438;--line:#26334d;--txt:#e7ecf6;--mut:#8f9bb3;--acc:#38bdf8;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--r:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.noscroll{overflow:hidden}
.hidden{display:none!important}
.top{position:sticky;top:0;z-index:20;background:rgba(11,15,23,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 12px 0}
.brand{font-weight:800;letter-spacing:.08em;font-size:13px;padding:0 2px 6px;color:var(--mut)}
.brand span{color:var(--acc)}
#nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav button{background:none;border:0;color:var(--mut);font-weight:600;font-size:14px;font-family:inherit;padding:9px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
#nav button.on{color:var(--txt);border-bottom-color:var(--acc)}
main{max-width:1100px;margin:0 auto;padding:14px 12px 90px}
h1,h2,h3{margin:0 0 10px}
h2{font-size:17px}h3{font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.card2{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.mut{color:var(--mut)}.sm{font-size:12px}.b{font-weight:700}.r{text-align:right}.c{text-align:center}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:22px;line-height:1.15}
.kpi span{font-size:12px;color:var(--mut)}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:8px 12px;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#04202e}
.btn.bad{border-color:#5b2430;color:#fca5a5}
.btn.s{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5}
input,select,textarea{background:#0e1523;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font:inherit;width:100%;min-width:0}
input[type=checkbox]{width:auto}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
label.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--txt)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days7 label{align-items:center;text-align:center}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:#22304a;color:#c7d2e6}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;color:var(--mut);font-weight:600;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:7px 8px;border-bottom:1px solid #1b263b;vertical-align:middle}
table.t tr.clk{cursor:pointer}table.t tr.clk:hover td{background:#18233a}
table.t tr.now td{background:#16304a}
.scroll{overflow-x:auto}
.bar{height:8px;background:#0e1523;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.wchart{display:block;width:100%;height:60px;background:#0e1523;border-radius:8px}
.wchart.big{height:110px}
.sess{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-left:4px solid var(--c,#3b82f6);border-radius:10px;background:var(--card2);margin-top:8px}
.sess .nm{font-weight:700;cursor:pointer}
.sess.done{opacity:.72}.sess.done .nm::before{content:"✓ ";color:var(--ok)}
.sess .wchart{height:42px}
.pc text{fill:var(--mut);font-size:10px}
.pc .lbl{fill:#e7ecf6;font-size:10px;font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* calendario */
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mg .dh{font-size:11px;color:var(--mut);text-align:center;padding:2px 0}
.cell{min-height:96px;background:var(--card2);border:1px solid var(--line);border-top:3px solid var(--ph,var(--line));border-radius:8px;padding:3px;overflow:hidden}
.cell.dim{opacity:.45}.cell.today{outline:2px solid var(--acc)}.cell.over{background:#1d3150}
.cell .cn{font-size:12px;color:var(--mut);cursor:pointer;display:flex;justify-content:space-between}
.chip{font-size:11px;line-height:1.2;background:#0e1523;border-left:3px solid var(--c,#3b82f6);border-radius:4px;padding:3px 4px;margin-top:3px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.done{opacity:.6;text-decoration:line-through}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.day.today{border-color:var(--acc)}
.day .dh2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:50;display:flex;justify-content:center;overflow:auto;padding:14px 8px}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:14px;width:100%;max-width:780px;padding:16px;margin:auto 0;height:fit-content}
.mbox.wide{max-width:960px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mh h3{margin:0;font-size:17px}
.x{background:none;border:0;color:var(--mut);font-size:20px;cursor:pointer}
.seg{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}
.seg .sh{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.seg .sh select{width:auto}
.seg .sb{display:flex;gap:4px}
.seg .sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.wh{font-style:normal;font-size:11px;color:var(--acc)}
.zt{display:flex;align-items:center;gap:8px}
.zt i{width:12px;height:12px;border-radius:3px;display:inline-block}
.sb2{position:fixed;left:50%;bottom:18px;transform:translateX(-50%)}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,40px);background:#0e1523;border:1px solid var(--acc);color:var(--txt);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw;font-size:14px}
#toast.show{opacity:1;transform:translate(-50%,0)}
.warn{color:var(--warn)}.err{color:#fca5a5}
.hero{text-align:center;padding:28px 16px}
.hero p{color:var(--mut);max-width:560px;margin:8px auto 16px}
/* runner */
.run{position:fixed;inset:0;background:#070a10;z-index:80;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 14px 18px}
.run .rt{display:flex;justify-content:space-between;align-items:center;gap:10px}
.run .big{font-size:min(26vw,170px);font-weight:800;line-height:1;text-align:center;margin:10px 0 0;font-variant-numeric:tabular-nums}
.run .mid{font-size:min(14vw,80px);font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.run .nx{text-align:center;color:var(--mut);margin:6px 0}
.run .ctr{display:flex;gap:10px;justify-content:center;margin-top:14px}
.run .ctr .btn{font-size:20px;padding:12px 22px}
.run .zone{border-radius:14px;padding:10px;margin-top:8px;text-align:center}
.runchart{position:relative;margin-top:14px}
.runchart .cur{position:absolute;top:0;bottom:0;width:2px;background:#fff;left:0}
#print{display:none}
@media (max-width:640px){
 .cell{min-height:70px}.chip{font-size:10px;padding:2px 3px}
 .sess{grid-template-columns:80px 1fr}.sess .acts{grid-column:1/-1}
 .days7{gap:3px}
}
@media print{
 body>*:not(#print){display:none!important}
 #print{display:block!important;color:#000;background:#fff;font-size:11px}
 html,body{background:#fff}
 #print h1{font-size:18px}#print h2{font-size:14px;margin:12px 0 4px}
 #print table{width:100%;border-collapse:collapse;margin-bottom:8px}
 #print th,#print td{border:1px solid #999;padding:3px 5px;text-align:left}
 #print tr{page-break-inside:avoid}
}
</style>
</head>
<body>
<header class="top"><div class="brand">PERIODIZACIÓN <span>CICLISMO</span></div><nav id="nav"></nav></header>
<main id="view"></main>
<div id="modal" class="modal hidden"></div>
<div id="run" class="run hidden"></div>
<div id="toast"></div>
<div id="print"></div>
<script>
'use strict';
/* =====================================================================
   PERIODIZACIÓN CICLISMO — planificador por bloques (sin IA, offline)
   ===================================================================== */

/* ============ UTILIDADES ============ */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>Array.from(el.querySelectorAll(s));
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const clone=o=>JSON.parse(JSON.stringify(o));
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return iso(d);};
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const mondayOf=s=>{const d=parseD(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d);};
const todayISO=()=>iso(new Date());
const dowIdx=s=>(parseD(s).getDay()+6)%7;
const DOW=['L','M','X','J','V','S','D'];
const DOWL=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DOW3=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fmtDate=(s,y)=>{const d=parseD(s);return `${d.getDate()} ${MES3[d.getMonth()]}${y?' '+d.getFullYear():''}`;};
const fmtLong=s=>{const d=parseD(s);return `${DOWL[dowIdx(s)]} ${d.getDate()} de ${MES[d.getMonth()].toLowerCase()}`;};
const fmtHM=sec=>{const m=Math.round(sec/60),h=Math.floor(m/60);return h?`${h}h${pad(m%60)}`:`${m}′`;};
const fmtH=h=>(Math.round(h*10)/10).toFixed(1).replace('.',',');
const fmtMS=sec=>{sec=Math.round(sec);return `${Math.floor(sec/60)}:${pad(sec%60)}`;};
const parseMS=t=>{t=String(t).trim().replace(',','.');if(!t)return NaN;if(t.includes(':')){const p=t.split(':').map(Number);if(p.some(isNaN))return NaN;return p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1];}const n=Number(t);return isNaN(n)?NaN:Math.round(n*60);};
const fmtMin=m=>m>=60?`${Math.floor(m/60)}h${m%60?pad(m%60):''}`:`${m}′`;
const pc=p=>Math.round(p*100);

/* ============ ESTADO ============ */
const KEY='periodizacion_ciclismo_v1';
let S;
let ED=null;   /* editor de sesión en curso */
function defState(){return{v:1,
 profile:{ftp:250,lthr:165,hrmax:185,weight:75,disc:'R',level:'intermedio'},
 days:[1,1.5,1,1.5,0,3,2.5],events:[],plan:null,custom:[],
 ui:{tab:'home',cal:'week',calRef:null,libQ:'',libF:'',libD:''}};}
function load(){const d=defState();
 try{const r=localStorage.getItem(KEY);
  if(r){const o=JSON.parse(r);
   S={...d,...o,profile:{...d.profile,...(o.profile||{})},ui:{...d.ui,...(o.ui||{})}};
   if(!Array.isArray(S.days)||S.days.length!==7)S.days=d.days;
   if(!Array.isArray(S.events))S.events=[];
   if(!Array.isArray(S.custom))S.custom=[];
   return;}
 }catch(e){console.warn(e);}
 S=d;}
let _st=null;
function save(){clearTimeout(_st);_st=setTimeout(flush,200);}
function flush(){clearTimeout(_st);try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('⚠ No se pudo guardar en el navegador. Haz una copia en Datos → Exportar.');}}
window.addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush();});

/* ============ ZONAS ============ */
const ZC=['','#8a93a6','#3b82f6','#22c55e','#eab308','#f97316','#ef4444','#a855f7'];
const zoneOf=p=>p<.56?1:p<.76?2:p<.91?3:p<1.06?4:p<1.21?5:p<1.51?6:7;
const PZ=[
 [1,'Recuperación activa',0,.55],[2,'Resistencia',.56,.75],[3,'Tempo',.76,.90],
 [4,'Umbral',.91,1.05],[5,'VO2max',1.06,1.20],[6,'Capacidad anaeróbica',1.21,1.50],[7,'Neuromuscular',1.51,null]];
const HZ=[
 [1,'Recuperación',0,.81],[2,'Resistencia',.81,.89],[3,'Tempo',.90,.93],[4,'Sub-umbral',.94,.99],
 [5,'Umbral (5a)',1.00,1.02],[6,'VO2max (5b)',1.03,1.06],[7,'Anaeróbico (5c)',1.07,null]];

/* ============ MOTOR DE ENTRENO ============ */
/* segmentos: s=constante, r=rampa, i=intervalos (esfuerzo + recuperación). Potencias en fracción de FTP. */
const seg=(m,p,c)=>({t:'s',d:Math.round(m*60),p,c});
const ramp=(m,a,b,c)=>({t:'r',d:Math.round(m*60),p:a,p2:b,c});
const ints=(n,onM,onP,offM,offP,c,c2)=>({t:'i',n,d:Math.round(onM*60),p:onP,d2:Math.round(offM*60),p2:offP,c,c2});
const cat=(...p)=>p.flat();

function flatten(segs){
 const out=[];
 (segs||[]).forEach((g,gi)=>{
  if(g.t==='s')out.push({d:g.d,p0:g.p,p1:g.p,c:g.c,gi});
  else if(g.t==='r')out.push({d:g.d,p0:g.p,p1:g.p2,c:g.c,gi});
  else if(g.t==='i'){
   for(let k=0;k<g.n;k++){
    out.push({d:g.d,p0:g.p,p1:g.p,c:g.c,gi,on:true,rep:k+1,n:g.n});
    if(g.d2>0)out.push({d:g.d2,p0:g.p2,p1:g.p2,c:g.c2,gi,off:true,rep:k+1,n:g.n});
   }
  }
 });
 return out.filter(s=>s.d>0);
}
function stats(segs,ftp){
 const st=flatten(segs);let T=0;for(const s of st)T+=s.d;
 if(!T)return{dur:0,np:0,tss:0,avg:0,kj:0,steps:st};
 const arr=new Float32Array(T);let k=0;
 for(const s of st){for(let i=0;i<s.d;i++)arr[k++]=s.p0+(s.p1-s.p0)*((i+.5)/s.d);}
 let sum=0;for(let i=0;i<T;i++)sum+=arr[i];
 const avg=sum/T;
 let roll=0,acc=0,cnt=0;
 for(let i=0;i<T;i++){roll+=arr[i];if(i>=30)roll-=arr[i-30];if(i>=29){const m=roll/30;acc+=m*m*m*m;cnt++;}}
 const np=cnt?Math.pow(acc/cnt,.25):avg;
 return{dur:T,np,avg,tss:T*np*np/3600*100,kj:avg*ftp*T/1000,steps:st};
}
const isRide=s=>!['fuerza','movilidad','descanso'].includes(s.kind);
function sInfo(s){
 if(s.segs&&s.segs.length){const st=stats(s.segs,S.profile.ftp);return{dur:st.dur,tss:st.tss,np:st.np,avg:st.avg,kj:st.kj,bike:true};}
 return{dur:(s.min||0)*60,tss:s.tss||0,np:0,avg:0,kj:0,bike:false};
}
function sReal(s){
 if(!s.done)return null;
 const p=sInfo(s),a=s.act||{};
 return{dur:(a.min!=null&&a.min!=='')?a.min*60:p.dur,tss:(a.tss!=null&&a.tss!=='')?+a.tss:p.tss};
}
function sessZone(s){
 if(!s.segs)return 0;let m=0;
 flatten(s.segs).forEach(st=>{if(st.p0===st.p1&&st.d>=10&&st.p0>m)m=st.p0;});
 if(!m)m=sInfo(s).np;return zoneOf(m);
}
function sessColor(s){
 if(s.kind==='evento')return'#eab308';
 if(s.kind==='fuerza')return'#a78bfa';
 if(s.kind==='movilidad')return'#64748b';
 if(s.kind==='descanso')return'#475569';
 if(s.segs)return ZC[sessZone(s)]||'#94a3b8';
 return'#94a3b8';
}
function chartSVG(steps,o={}){
 const W=o.w||600,H=o.h||80,T=steps.reduce((a,s)=>a+s.d,0);
 if(!T)return`<svg class="wchart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"></svg>`;
 let mx=1.3;for(const s of steps)mx=Math.max(mx,s.p0,s.p1);mx*=1.04;
 let x=0,h='';
 for(const s of steps){
  const w=s.d/T*W,y0=H-s.p0/mx*H,y1=H-s.p1/mx*H;
  h+=`<polygon points="${x.toFixed(2)},${H} ${x.toFixed(2)},${y0.toFixed(1)} ${(x+w).toFixed(2)},${y1.toFixed(1)} ${(x+w).toFixed(2)},${H}" fill="${ZC[zoneOf((s.p0+s.p1)/2)]}"/>`;
  x+=w;
 }
 const yf=H-1/mx*H;
 h+=`<line x1="0" x2="${W}" y1="${yf.toFixed(1)}" y2="${yf.toFixed(1)}" stroke="rgba(255,255,255,.35)" stroke-dasharray="4 4" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
 return`<svg class="wchart ${o.cls||''}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${h}</svg>`;
}

/* ============ BIBLIOTECA DE SESIONES ============ */
const WU=(m=12)=>ramp(m,.45,.75);
const WUQ=()=>[ramp(10,.45,.75),ints(3,1,.95,1,.55)];
const CD=(m=5)=>ramp(m,.6,.4);
const Z2D=[60,90,120,150,180,210,240,300];
function z2(m,name,p){
 p=p||.68;const w=m>=90?10:5;
 return{name:name||`Resistencia Z2 ${fmtMin(m)}`,segs:cat(ramp(w,.45,p-.02),seg(m-2*w,p),ramp(w,p-.02,.45))};
}
const TEMPO_T=[[2,20,.80],[2,25,.82],[3,20,.82],[2,30,.84],[3,25,.84],[2,40,.85]];
const SS_T=[[2,12,.88],[2,15,.89],[3,12,.90],[2,20,.90],[3,15,.91],[3,20,.92]];
const UMB_T=[[3,8,1],[2,12,1],[3,10,1],[2,15,1],[3,12,1],[2,20,1],[3,15,1.01]];
const OU_T=[[2,4],[2,5],[3,4],[3,5],[3,6],[4,5]];
const VO2_T=[[4,3,1.22],[5,3,1.22],[4,4,1.18],[5,4,1.18],[5,5,1.15],[6,5,1.15],[4,8,1.10]];
const TRE_T=[[2,8],[2,10],[3,8],[3,10],[3,12]];
const ANA_T=[6,8,10,12];
const SPR_T=[6,8,10];
const SFR_T=[[3,6],[4,6],[4,8],[5,8],[4,10],[5,10]];
const SUB_T=[[3,8,.97],[3,10,.97],[3,12,.97],[4,10,.98],[3,15,.98],[4,12,.98]];
const DUR_T=[[180,2,15,.88],[210,3,15,.88],[240,3,20,.90],[270,3,20,.92],[300,4,20,.90],[330,4,20,.92]];
const XC_T=[2,3,4,5];
const RAF_T=[[2,6],[3,6],[3,8],[4,8]];

const FAM={
 REC:{f:'Recuperación',z:'Z1',disc:'RGM',L:3,
  desc:'Rodaje muy suave para eliminar fatiga. Cadencia alta y ligera, sin mirar el ritmo.',
  mk:l=>{const m=[30,45,60][l];return{name:`Recuperación ${m}′`,segs:[seg(m,.5)]};}},
 Z2:{f:'Resistencia',z:'Z2',disc:'RGM',L:Z2D.length,

function planDims(P){
 const start=mondayOf(P.start);
 if(!P.end||P.end<start)return{err:'La fecha del evento debe ser posterior al inicio del plan.'};
 const W=diffDays(start,mondayOf(P.end))/7+1;
 if(W<4)return{err:'Hacen falta al menos 4 semanas entre el inicio del plan y el evento.'};
 if(W>60)return{err:'Máximo 60 semanas por plan.'};
 if(!(P.days||[]).some(h=>h>=.75))return{err:'Indica tu disponibilidad semanal (al menos un día con 45′ o más).'};
 if(!(P.baseH>=2)||!(P.peakH>=P.baseH))return{err:'Horas base ≥ 2 y horas pico ≥ horas base.'};
 let T=P.taper==='auto'?((P.evH>=5)?2:1):parseInt(P.taper,10);
 T=clamp(isNaN(T)?1:T,1,3);T=Math.min(T,W-3);
 const M=W-T,loaded=P.cycle==='2:1'?2:P.cycle==='4:1'?4:3,Lb=loaded+1,B=Math.ceil(M/Lb);
 return{start,W,T,M,loaded,Lb,B};
}

 const center=(b*Lb+Math.min(Lb,M-b*Lb)/2)/M;

}

function qPool(P,phase,r){
 const d=P.disc,m=P.model,odd=r%2===1;
 if(m==='bloques'){
  if(phase==='Acumulación')return[odd?'TEMPO':'SS','SFR','SS'];
  if(d==='R')return odd?['UMBRAL','VO2','ANA']:['VO2','UMBRAL','TRE'];
  if(d==='G')return odd?['OU','TRE','DUR']:['VO2','OU','DUR'];
  return odd?['TRE','RAF','XC']:['VO2','XC','RAF'];
 }
 if(m==='polarizado'){
  if(phase==='Base'||phase==='Construcción')return odd?['TRE','VO2']:['VO2','TRE'];
  return d==='R'?['VO2','SUB','TRE']:d==='G'?['DUR','VO2','TRE']:['VO2',odd?'RAF':'XC','TRE'];
 }
 if(m==='piramidal'){
  if(phase==='Base')return odd?['SS','TEMPO']:['TEMPO','SS'];
  if(phase==='Construcción')return odd?['TEMPO','SS','UMBRAL']:['SS','TEMPO','UMBRAL'];
  return d==='R'?['UMBRAL','SUB','SS']:d==='G'?['DUR','UMBRAL','SS']:['UMBRAL',odd?'RAF':'XC','SS'];
 }
 if(phase==='Base')return[['TEMPO','SFR','SS'],['SS','SFR','TEMPO'],['TEMPO','SS','SFR']][r%3];
 if(phase==='Construcción')return d==='M'?['SS','VO2','UMBRAL']:['SS',odd?'OU':'UMBRAL','VO2'];
 return d==='R'?[odd?'OU':'UMBRAL','SUB','VO2']:d==='G'?['DUR',odd?'OU':'UMBRAL','VO2']:['VO2',odd?'RAF':'XC','ANA'];
}

 if(taper)return Math.max(0,(ctx.lv[key]!=null?ctx.lv[key]:st)-2);

function combos(arr,k,start=0,cur=[],out=[]){
 if(cur.length===k){out.push(cur.slice());return out;}
 for(let i=start;i<arr.length;i++){cur.push(arr[i]);combos(arr,k,i+1,cur,out);cur.pop();}
 return out;
}
function pickQDays(others,k,longD,av){
 k=Math.min(k,others.length);if(k<=0)return[];
 let best=null,bs=-1e9;
 for(const c of combos(others,k)){
  let s=0;
  for(let i=0;i<c.length;i++){
   const d=c[i];
   if(d===longD-1)s-=4;if(d===longD+1)s-=2;if(d>=1&&d<=3)s+=1;
   s+=Math.min(av[d],2)*.5;
   if(i>0&&c[i]-c[i-1]===1)s-=5;
  }
  if(s>bs){bs=s;best=c;}
 }
 return best||[];
}

function layoutWeek(wk,ctx,taperMode){
 const P=ctx.P,av=P.days,H=wk.H,res=[[],[],[],[],[],[],[]];
 const cand=[0,1,2,3,4,5,6].filter(d=>av[d]>=.75);
 if(!cand.length)return res;
 const rank=d=>d===5?0:d===6?1:2;
 const longD=cand.slice().sort((a,b)=>av[b]-av[a]||rank(a)-rank(b))[0];
 let qk=[],longKey=null;
 if(wk.type==='carga')qk=qPool(P,wk.phase,wk.rot).slice(0,qCount(P.level,wk.phase));
 else if(taperMode){qk=[taperQ(P)];if(P.level==='avanzado'&&wk.i-ctx.M===0&&ctx.T>=2)qk.push(P.disc==='M'?'XC':'UMBRAL');}
 qk=[...new Set(qk)];
 if(qk.includes('DUR')){if(wk.type==='carga')longKey='DUR';qk=qk.filter(k=>k!=='DUR');}
 const maxQ=H<3.5?1:H<5.5?2:3;
 qk=qk.slice(0,Math.min(maxQ,Math.max(0,cand.length-1)));
 const others=cand.filter(d=>d!==longD);
 const qd=pickQDays(others,qk.length,longD,av).sort((a,b)=>a-b);
 let used=0;
 qd.forEach((day,i)=>{
  const key=qk[i];
  const l=pickLevel(ctx,key,taperMode);
  const f=fitSession(key,l,av[day]*3600);
  if(f){if(!taperMode)ctx.lv[key]=f.l;const s=sessFrom(f.s);res[day].push(s);used+=sInfo({segs:s.segs}).dur/3600;}
 });
 /* salida larga */
 const longAv=av[longD]*60;
 let longS=null;
 if(longKey){
  const l=pickLevel(ctx,'DUR',false);
  const f=fitSession('DUR',l,Math.min(longAv,Math.max(180,H*60*.45))*60);
  if(f){ctx.lv.DUR=f.l;longS=sessFrom(f.s);}
 }
 if(!longS){
  const hi=Math.min(longAv,360),lo=Math.min(60,hi);
  let m=Math.round(clamp(H*60*.32,lo,hi)/15)*15;m=Math.max(45,m);
  longS=z2Sess(m,wk.type==='descarga'||taperMode,`Fondo Z2 ${fmtMin(m)}`);
  if(wk.type==='descarga'||taperMode)longS.name=`Fondo suave ${fmtMin(m)}`;
 }
 res[longD].push(longS);
 used+=sInfo({segs:longS.segs}).dur/3600;
 /* resto: Z2 */
 const Hrem=H-used;
 const z=cand.filter(d=>d!==longD&&!res[d].length).sort((a,b)=>av[b]-av[a]);
 let nz=z.length;while(nz>0&&Hrem/nz<.75)nz--;
 const easy=wk.type==='descarga'||taperMode;
 z.slice(0,nz).sort((a,b)=>a-b).forEach(d=>{
  const h=Math.min(av[d],Hrem/nz,2.5);let m=Math.floor(h*60/15)*15;if(m<45)m=45;
  res[d].push(z2Sess(m,easy));
 });
 /* fuerza */
 const sc=strengthCount(P,wk);
 if(sc){
  const el=[0,1,2,3,4,5,6].filter(d=>d!==longD&&d!==longD-1);
  const pri=d=>res[d].some(s=>QUAL.has(s.fam))?0:res[d].length?1:2;
  el.sort((a,b)=>pri(a)-pri(b)||a-b);
  const placed=[];
  for(const d of el){
   if(placed.length>=sc)break;
   if(placed.some(x=>Math.abs(x-d)===1))continue;
   res[d].push(offSession(placed.length===0?'FUERZA':'FUERZA_RES'));placed.push(d);
  }
 }
 return res;
}

  if(x.t==='s')step(x.p<.6?'Suave':'Bloque',x.d,x.p,x.p,x.p<.6?4:0);
  else if(x.t==='r'){
   const asc=x.p2>=x.p,k=clamp(Math.round(x.d/120),2,6);
   const inten=(i===0&&asc)?2:(i===g.length-1&&!asc)?3:0;
   for(let j=0;j<k;j++){
    const a=x.p+(x.p2-x.p)*j/k,b=x.p+(x.p2-x.p)*(j+1)/k;
    step(inten===2?'Calentar':inten===3?'Enfriar':'Rampa',x.d/k,a,b,inten);
   }
  }else{

function fitVal(dv,pos,type,size,little){

  if(t===0||t===2||t===0x0D)return size>=1?(dv.getUint8(pos)===0xFF?null:dv.getUint8(pos)):null;
  if(t===0x0A)return dv.getUint8(pos)===0?null:dv.getUint8(pos);
  if(t===1)return dv.getInt8(pos);
  if(size===1)return dv.getUint8(pos);
  if(t===3&&size===2)return dv.getInt16(pos,little);
  if(t===4&&size===2){const v=dv.getUint16(pos,little);return v===0xFFFF?null:v;}
  if(t===0x0B&&size===2){const v=dv.getUint16(pos,little);return v===0?null:v;}
  if(t===5&&size===4)return dv.getInt32(pos,little);
  if(t===6&&size===4){const v=dv.getUint32(pos,little);return v===0xFFFFFFFF?null:v;}
  if(t===0x0C&&size===4){const v=dv.getUint32(pos,little);return v===0?null:v;}

}

function analyzeRecs(recs){

 else tss=0;
 const start=recs[0].t;
 return{start,date:iso(new Date(start*1000)),dur,avgP,np,maxP:mx,kj:sum/1000,hr,cad,tss,hasPower};
}
function actFromA(a,fname){
 return{min:Math.round(a.dur/60),tss:Math.round(a.tss),key:a.start+'_'+a.dur,
  hr:a.hr?Math.round(a.hr):undefined,np:a.hasPower?Math.round(a.np):undefined,avgp:a.hasPower?Math.round(a.avgP):undefined,
  cad:a.cad?Math.round(a.cad):undefined,kj:a.hasPower?Math.round(a.kj):undefined,
  txt:`Importado de ${fname}${a.hasPower?'':' (TSS estimado por FC)'}`};
}
function placeActivity(a,fname){
 if(!S.plan)return'noplan';
 const key=a.start+'_'+a.dur;
 for(const d of Object.keys(S.plan.sessions))if(S.plan.sessions[d].some(s=>s.act&&s.act.key===key))return'dup';
 const act=actFromA(a,fname);
 const cand=(S.plan.sessions[a.date]||[]).filter(s=>s.segs&&!s.done);
 if(cand.length){
  cand.sort((x,y)=>Math.abs(sInfo(x).dur-a.dur)-Math.abs(sInfo(y).dur-a.dur));
  cand[0].done=true;cand[0].act=act;return'match';
 }
 putSess(a.date,{id:uid(),kind:'otro',name:'Salida importada',focus:'Real',min:act.min,tss:act.tss,notes:'',done:true,act});
 return'new';
}
async function importFiles(files){
 const r={match:0,new:0,dup:0,err:[]};
 for(const f of Array.from(files)){
  try{
   const ext=f.name.toLowerCase().split('.').pop();
   let parsed;
   if(ext==='fit')parsed=parseFIT(await f.arrayBuffer());
   else if(ext==='tcx')parsed=parseTCX(await f.text());
   else throw new Error('formato no soportado');
   const a=analyzeRecs(parsed.recs);
   const res=placeActivity(a,f.name);
   if(res==='noplan'){toast('Crea primero un plan para importar actividades');return r;}
   r[res]++;
  }catch(e){r.err.push(f.name+': '+e.message);}
 }
 save();render();
 let m=`${r.match+r.new} importada(s): ${r.match} emparejada(s) con el plan, ${r.new} nueva(s)`;
 if(r.dup)m+=` · ${r.dup} ya importada(s)`;
 if(r.err.length)m+=` · ${r.err.length} con error (${r.err[0]})`;
 toast(m);
 return r;
}

/* ---------- PLAN ---------- */
function planChart(p,agg,ser){
 const n=p.weeks.length,cw=Math.max(26,Math.min(48,900/n)),left=34,W=n*cw+left+10,H=310;
 const phH=22,barTop=34,barBot=190,tsbTop=222,tsbBot=290;
 const maxT=Math.max(100,...agg.map(a=>a.tss))*1.1;
 const maxC=Math.max(30,...ser.map(x=>Math.max(x.ctl,x.atl)))*1.15;
 let tmin=-30,tmax=15;ser.forEach(x=>{tmin=Math.min(tmin,x.tsb);tmax=Math.max(tmax,x.tsb);});
 tmin-=5;tmax+=5;
 let h='';
 /* fases */
 let i=0;
 while(i<n){let j=i;while(j+1<n&&p.weeks[j+1].phase===p.weeks[i].phase)j++;
  const x=left+i*cw,w=(j-i+1)*cw;
  h+=`<rect x="${x+1}" y="0" width="${w-2}" height="${phH}" rx="4" fill="${PH_COL[p.weeks[i].phase]||'#475569'}" opacity=".9"/><text class="lbl" x="${x+w/2}" y="15" text-anchor="middle" style="fill:#04101a">${w>70?esc(p.weeks[i].phase):''}</text>`;
  i=j+1;}
 /* barras */
 const ys=v=>barBot-v/maxT*(barBot-barTop);
 for(let k=0;k<=2;k++){const v=maxT/1.1*k/2,y=ys(v);h+=`<line x1="${left}" x2="${W-6}" y1="${y}" y2="${y}" stroke="#25324b" stroke-dasharray="2 4"/><text x="${left-4}" y="${y+3}" text-anchor="end">${Math.round(v)}</text>`;}
 p.weeks.forEach((w,k)=>{
  const a=agg[k],x=left+k*cw+3,bw=cw-6,y=ys(a.tss);
  h+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(0,barBot-y)}" rx="3" fill="${WT_COL[w.type]||'#3b82f6'}" opacity=".85"><title>Semana ${k+1} · ${Math.round(a.tss)} TSS · ${fmtH(a.dur/3600)} h</title></rect>`;
  if(a.dtss>0){const y2=ys(Math.min(a.dtss,a.tss||a.dtss));h+=`<rect x="${x+bw*.3}" y="${y2}" width="${bw*.4}" height="${Math.max(0,barBot-y2)}" fill="#fff" opacity=".55"/>`;}
  h+=`<text x="${x+bw/2}" y="${barBot+13}" text-anchor="middle">${k+1}</text>`;
  if(cw>=30||k%2===0)h+=`<text x="${x+bw/2}" y="${barBot+25}" text-anchor="middle" style="font-size:8px">${parseD(w.start).getDate()}/${parseD(w.start).getMonth()+1}</text>`;
 });
 /* CTL / ATL */
 const xs=idx=>left+idx/7*cw,yc=v=>barBot-v/maxC*(barBot-barTop);
 h+=`<polyline fill="none" stroke="#38bdf8" stroke-width="2" points="${ser.map((x,k)=>`${xs(k).toFixed(1)},${yc(x.ctl).toFixed(1)}`).join(' ')}"/>`;
 h+=`<polyline fill="none" stroke="#f87171" stroke-width="1.4" points="${ser.map((x,k)=>`${xs(k).toFixed(1)},${yc(x.atl).toFixed(1)}`).join(' ')}"/>`;
 /* TSB */
 const yt=v=>tsbBot-(v-tmin)/(tmax-tmin)*(tsbBot-tsbTop);
 h+=`<text x="${left}" y="${tsbTop-6}" style="font-size:10px">TSB (CTL − ATL)</text>`;
 h+=`<rect x="${left}" y="${yt(25)}" width="${W-left-6}" height="${Math.max(0,yt(5)-yt(25))}" fill="#22c55e" opacity=".10"/>`;
 h+=`<line x1="${left}" x2="${W-6}" y1="${yt(0)}" y2="${yt(0)}" stroke="#8f9bb3" stroke-width=".8"/><text x="${left-4}" y="${yt(0)+3}" text-anchor="end">0</text>`;
 h+=`<polyline fill="none" stroke="#a78bfa" stroke-width="1.8" points="${ser.map((x,k)=>`${xs(k).toFixed(1)},${yt(x.tsb).toFixed(1)}`).join(' ')}"/>`;
 /* hoy */
 const t=todayISO(),ti=diffDays(p.start,t);
 if(ti>=0&&ti<n*7){const x=xs(ti);h+=`<line x1="${x}" x2="${x}" y1="${phH}" y2="${tsbBot}" stroke="#fff" stroke-dasharray="4 3" opacity=".6"/><text x="${x+3}" y="${phH+10}" style="fill:#fff">hoy</text>`;}
 /* evento */
 const ei=diffDays(p.start,p.end);
 if(ei>=0&&ei<n*7+7){const x=xs(ei);h+=`<line x1="${x}" x2="${x}" y1="${phH}" y2="${tsbBot}" stroke="#eab308" stroke-dasharray="4 3"/><text x="${x-4}" y="${phH+10}" text-anchor="end" style="fill:#eab308">evento</text>`;}
 return`<div class="scroll"><svg class="pc" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${h}</svg></div>
 <div class="legend"><span><i style="background:#3b82f6"></i>Carga</span><span><i style="background:#64748b"></i>Descarga</span><span><i style="background:#22c55e"></i>Puesta a punto</span><span><i style="background:#eab308"></i>Carrera</span><span><i style="background:#38bdf8"></i>CTL (forma)</span><span><i style="background:#f87171"></i>ATL (fatiga)</span><span><i style="background:#a78bfa"></i>TSB</span><span><i style="background:#fff"></i>TSS hecho</span></div>`;
}

function libFind(id){return libItems().find(x=>x.id===id);}
function libView(id){
 const it=libFind(id);if(!it)return;
 const st=stats(it.segs,S.profile.ftp),ftp=S.profile.ftp;
 const rows=flatten(it.segs);

 const lines=[];
 (it.segs||[]).forEach(g=>{

  else if(g.t==='r')lines.push(`${fmtMS(g.d)} rampa ${pc(g.p)}→${pc(g.p2)}% (${Math.round(g.p*ftp)}→${Math.round(g.p2*ftp)} W)`);
  else lines.push(`${g.n}× [ ${fmtMS(g.d)} @ ${pc(g.p)}% (${Math.round(g.p*ftp)} W)${g.c?` ${g.c} rpm`:''} / ${fmtMS(g.d2)} @ ${pc(g.p2)}% (${Math.round(g.p2*ftp)} W) ]`);
 });
 showModal(`<div class="mh"><h3>${esc(it.name)}</h3><button class="x" data-a="close">✕</button></div>
 <div class="sm mut">${esc(it.focus)} · ${fmtHM(st.dur)} · TSS ${Math.round(st.tss)} · IF ${st.np.toFixed(2)} · NP ${Math.round(st.np*ftp)} W · ${Math.round(st.kj)} kJ</div>

 <div class="card2 sm">${lines.map(l=>`<div>${l}</div>`).join('')}</div>

 <button class="btn" data-a="libExp" data-id="${it.id}" data-f="fit">.fit</button><button class="btn" data-a="libExp" data-id="${it.id}" data-f="zwo">.zwo</button><button class="btn" data-a="libExp" data-id="${it.id}" data-f="erg">.erg</button><button class="btn" data-a="libExp" data-id="${it.id}" data-f="mrc">.mrc</button>

/* ---------- ASISTENTE DE PLAN ---------- */
function openWizard(){
 const t=todayISO(),m=mondayOf(t),start=m===t?t:addDays(m,7);
 const evs=S.events.filter(e=>e.date>=t).sort((a,b)=>a.date.localeCompare(b.date));
 const defEv=evs.find(e=>e.prio==='A')||evs[0];
 const pp=S.plan&&S.plan.params,totAv=S.days.reduce((a,b)=>a+(+b||0),0);
 const base=pp?pp.baseH:Math.max(2,Math.round(totAv*.55*4)/4),peak=pp?pp.peakH:Math.max(base,Math.round(totAv*.9*4)/4);
 const date=defEv?defEv.date:addDays(start,84);
 showModal(`<div class="mh"><h3>Generar plan periodizado</h3><button class="x" data-a="close">✕</button></div>
 <div class="fg">
  <label class="f">Evento objetivo<select id="w-ev" data-wz="ev"><option value="">Fecha personalizada…</option>${evs.map(e=>`<option value="${e.id}" ${defEv&&defEv.id===e.id?'selected':''}>${esc(e.name)} · ${fmtDate(e.date,true)} (${e.prio})</option>`).join('')}</select></label>
  <label class="f">Nombre del objetivo<input id="w-name" data-wz value="${esc(defEv?defEv.name:'Objetivo')}"></label>
  <label class="f">Fecha del evento<input type="date" id="w-date" data-wz value="${date}"></label>
  <label class="f">Duración del evento (h)<input type="number" step="0.25" id="w-evh" data-wz value="${defEv?defEv.hours:4}"></label>
  <label class="f">IF del evento<input type="number" step="0.01" id="w-evif" data-wz value="${defEv?defEv.ifv:.75}"></label>
  <label class="f">Inicio del plan (lunes)<input type="date" id="w-start" data-wz value="${start}"></label></div>
 <div class="fg">
  <label class="f">Disciplina<select id="w-disc" data-wz>${Object.keys(DISC).map(k=>`<option value="${k}" ${(defEv?defEv.disc:S.profile.disc)===k?'selected':''}>${DISC[k]}</option>`).join('')}</select></label>
  <label class="f">Nivel<select id="w-level" data-wz>${Object.keys(LEVELS).map(k=>`<option value="${k}" ${S.profile.level===k?'selected':''}>${LEVELS[k]}</option>`).join('')}</select></label>
  <label class="f">Modelo<select id="w-model" data-wz>${Object.keys(MODELS).map(k=>`<option value="${k}" ${pp&&pp.model===k?'selected':''}>${MODELS[k].n}</option>`).join('')}</select></label>
  <label class="f">Ciclo carga:descarga<select id="w-cycle" data-wz>${['3:1','2:1','4:1'].map(k=>`<option ${pp&&pp.cycle===k?'selected':''}>${k}</option>`).join('')}</select></label>
  <label class="f">Horas semanales iniciales<input type="number" step="0.25" id="w-base" data-wz value="${base}"></label>
  <label class="f">Horas semanales pico<input type="number" step="0.25" id="w-peak" data-wz value="${peak}"></label>
  <label class="f">Puesta a punto (semanas)<select id="w-taper" data-wz>${['auto','1','2','3'].map(k=>`<option value="${k}" ${pp&&String(pp.taper)===k?'selected':''}>${k==='auto'?'Automática':k}</option>`).join('')}</select></label>
  <label class="f">CTL / ATL iniciales<div class="row" style="flex-wrap:nowrap"><input type="number" id="w-ctl" data-wz value="${pp?pp.ctl0:40}"><input type="number" id="w-atl" data-wz value="${pp?pp.atl0:40}"></div></label></div>
 <div id="w-mdesc" class="card2 sm"></div>
 <label class="f">Disponibilidad (horas por día, L–D)</label><div class="days7" style="margin-bottom:10px">${S.days.map((h,i)=>`<label class="f">${DOW[i]}<input type="number" step="0.25" min="0" max="12" id="w-d${i}" data-wz value="${h}"></label>`).join('')}</div>
 <div class="row" style="margin-bottom:10px"><label class="chk"><input type="checkbox" id="w-str" data-wz ${!pp||pp.strength?'checked':''}> Incluir fuerza fuera de la bici</label>
 <label class="chk"><input type="checkbox" id="w-trans" data-wz ${pp&&pp.transition?'checked':''}> Semana de transición posterior</label>
 <label class="chk"><input type="checkbox" id="w-man" data-wz ${pp&&pp.manual?'checked':''}> Plan vacío (rellenaré las sesiones a mano)</label></div>
 <div id="w-prev" class="card2 sm"></div>
 <div class="row"><button class="btn pri" data-a="wizGo">Generar plan</button><button class="btn" data-a="close">Cancelar</button></div>`,'wide');
 wizPreview();
}
function wizRead(){
 const g=id=>$('#'+id).value,n=id=>parseFloat(g(id));
 const days=[0,1,2,3,4,5,6].map(i=>Math.max(0,parseFloat(g('w-d'+i))||0));
 return{start:g('w-start')||todayISO(),end:g('w-date'),eventName:g('w-name').trim()||'Objetivo',evId:g('w-ev')||null,
  evH:n('w-evh')||3,evIF:n('w-evif')||.8,disc:g('w-disc'),level:g('w-level'),model:g('w-model'),cycle:g('w-cycle'),
  baseH:n('w-base'),peakH:n('w-peak'),taper:g('w-taper'),strength:$('#w-str').checked,transition:$('#w-trans').checked,manual:$('#w-man').checked,
  ctl0:n('w-ctl')||0,atl0:n('w-atl')||0,days};
}
function wizPreview(){
 if(!$('#w-prev'))return;
 $('#w-mdesc').innerHTML=`<b>${MODELS[$('#w-model').value].n}</b>: ${MODELS[$('#w-model').value].d}`;
 const P=wizRead(),D=planDims(P);
 if(D.err){$('#w-prev').innerHTML=`<span class="err">${esc(D.err)}</span>`;return;}
 const tot=P.days.reduce((a,b)=>a+b,0);let h=`<b>${D.W} semanas</b> · ${D.B} bloques (${P.cycle}) · puesta a punto ${D.T} sem. · disponibilidad ${fmtH(tot)} h/sem.`;
 if(P.peakH>tot*.92)h+=`<br><span class="warn">Las horas pico (${fmtH(P.peakH)}) superan tu disponibilidad útil: se limitarán a ${fmtH(tot*.92)} h.</span>`;
 if(P.level==='principiante'&&P.model==='bloques')h+=`<br><span class="warn">El modelo por bloques concentra intensidad; para empezar suele ir mejor el lineal.</span>`;
 $('#w-prev').innerHTML=h;
}
function wizGo(){
 const P=wizRead(),D=planDims(P);
 if(D.err){toast(D.err);return;}
 if(S.plan&&!confirm('Ya tienes un plan. Al generar uno nuevo se sustituye el actual (incluidas sesiones marcadas como hechas). ¿Continuar?'))return;
 try{
  S.days=P.days;S.profile.disc=P.disc;S.profile.level=P.level;
  S.plan=genPlan(P);S.ui.calRef=D.start;S.ui.tab='plan';
  save();closeModal();render();toast('Plan generado');
 }catch(e){console.error(e);toast('Error al generar: '+e.message);}
}

/* ---------- EDITOR DE SESIÓN ---------- */
function segHint(p){return`≈ ${Math.round(p*S.profile.ftp)} W`;}
function segEd(g,i){
 const f=(lab,fld,val,opt='')=>`<label class="f">${lab}<input data-sf="${fld}" value="${val}" ${opt}></label>`;
 const pf=(lab,fld,val)=>`<label class="f">${lab}<input data-sf="${fld}" type="number" min="0" max="300" step="1" value="${pc(val)}"><i class="wh">${segHint(val)}</i></label>`;
 const cf=(lab,fld,val)=>`<label class="f">${lab}<input data-sf="${fld}" type="number" min="30" max="200" placeholder="–" value="${val||''}"></label>`;
 let body='';
 if(g.t==='s')body=f('Duración (mm:ss)','d',fmtMS(g.d))+pf('% FTP','p',g.p)+cf('Cadencia','c',g.c);
 else if(g.t==='r')body=f('Duración (mm:ss)','d',fmtMS(g.d))+pf('% inicio','p',g.p)+pf('% fin','p2',g.p2)+cf('Cadencia','c',g.c);
 else body=`<label class="f">Repeticiones<input data-sf="n" type="number" min="1" max="60" value="${g.n}"></label>`+f('Esfuerzo (mm:ss)','d',fmtMS(g.d))+pf('Esfuerzo % FTP','p',g.p)+f('Recup. (mm:ss)','d2',fmtMS(g.d2))+pf('Recup. % FTP','p2',g.p2)+cf('Cad. esfuerzo','c',g.c)+cf('Cad. recup.','c2',g.c2);
 return`<div class="seg" data-i="${i}"><div class="sh"><select data-sf="t"><option value="s" ${g.t==='s'?'selected':''}>Constante</option><option value="r" ${g.t==='r'?'selected':''}>Rampa</option><option value="i" ${g.t==='i'?'selected':''}>Intervalos</option></select>
 <span class="sb"><button class="btn s" data-a="segUp">↑</button><button class="btn s" data-a="segDn">↓</button><button class="btn s bad" data-a="segDel">✕</button></span></div><div class="sg">${body}</div></div>`;
}

/* ---------- MODO RODILLO (guiado en pantalla) ---------- */
let RUN=null;
function beep(freq,dur){
 try{
  if(!RUN||!RUN.ac)return;
  const o=RUN.ac.createOscillator(),g=RUN.ac.createGain();
  o.frequency.value=freq;o.connect(g);g.connect(RUN.ac.destination);
  g.gain.setValueAtTime(.18,RUN.ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,RUN.ac.currentTime+dur);
  o.start();o.stop(RUN.ac.currentTime+dur);
 }catch(e){}
}
function runOpen(s,ref){
 const steps=flatten(s.segs);
 if(!steps.length){toast('La sesión no tiene estructura');return;}
 const total=steps.reduce((a,x)=>a+x.d,0);
 RUN={s,steps,total,idx:0,tStep:0,t:0,running:false,last:0,ref,timer:null,ac:null,wl:null,finished:false,lastBeep:-1,samples:[],t0:0,lastSec:-1,sentIdx:-1,btStopped:false,saved:false};
 const ftp=S.profile.ftp;
 const el=$('#run');el.classList.remove('hidden');document.body.classList.add('noscroll');
 el.innerHTML=`<div class="rt"><div><div class="b" id="r-name">${esc(s.name)}</div><div class="mut sm" id="r-info"></div></div><button class="btn" data-a="runClose">✕ Salir</button></div>
 <div class="zone" id="r-zone"><div class="mut sm" id="r-lab">—</div><div class="big" id="r-w">0</div><div class="mut" id="r-pct"></div></div>
 <div class="mid" id="r-left">0:00</div><div class="nx" id="r-next"></div>
 <div class="bar"><i id="r-bar" style="width:0"></i></div>
 <div class="runchart"><div id="r-chart"></div><div class="cur" id="r-cur"></div></div>
 <div class="c sm mut" id="r-live" style="margin-top:8px"></div><div class="row" id="r-bt" style="justify-content:center;margin-top:8px"></div>
 <div class="ctr"><button class="btn" data-a="runPrev">⏮</button><button class="btn pri" id="r-play" data-a="runPlay">▶</button><button class="btn" data-a="runNext">⏭</button></div>
 <p class="mut sm c" style="margin-top:10px">Sigue los vatios objetivo en el mando de tu bici (modo vatios fijos / ERG si lo tiene). Pita 3″ antes de cada cambio.</p>`;
 $('#r-chart').innerHTML=chartSVG(steps,{h:90,cls:'big'});
 btBar();
 runUI();
 RUN.timer=setInterval(runTick,200);
}
function runPlay(){
 if(!RUN)return;
 if(RUN.finished)return;
 RUN.running=!RUN.running;
 if(RUN.running){
  RUN.last=performance.now();
  try{if(!RUN.ac){const AC=window.AudioContext||window.webkitAudioContext;if(AC)RUN.ac=new AC();}if(RUN.ac&&RUN.ac.resume)RUN.ac.resume();}catch(e){}
  try{if(navigator.wakeLock&&!RUN.wl)navigator.wakeLock.request('screen').then(w=>{RUN.wl=w;}).catch(()=>{});}catch(e){}
  beep(880,.15);
  if(!RUN.t0)RUN.t0=Math.floor(Date.now()/1000);
  btRunStart();
 }else btRunPause();
 $('#r-play').textContent=RUN.running?'⏸':'▶';
}
function runTick(){
 if(!RUN)return;
 const now=performance.now();
 if(RUN.running){
  const dt=(now-RUN.last)/1000;RUN.last=now;
  RUN.tStep+=dt;RUN.t+=dt;
  while(RUN.idx<RUN.steps.length&&RUN.tStep>=RUN.steps[RUN.idx].d){
   RUN.tStep-=RUN.steps[RUN.idx].d;RUN.idx++;RUN.lastBeep=-1;
   if(RUN.idx<RUN.steps.length)beep(1175,.35);
  }
  if(RUN.idx>=RUN.steps.length){RUN.running=false;RUN.finished=true;RUN.t=RUN.total;beep(1319,.6);}
  else{
   const rem=Math.ceil(RUN.steps[RUN.idx].d-RUN.tStep);
   if(rem<=3&&rem>0&&RUN.lastBeep!==rem){RUN.lastBeep=rem;beep(660,.12);}
  }
 }
 btTick();
 runUI();
}
function runUI(){
 if(!RUN||!$('#r-w'))return;
 btLive();
 const ftp=S.profile.ftp,R=RUN;
 if(R.finished){
  $('#r-lab').textContent='¡Sesión completada!';$('#r-w').textContent='✓';$('#r-pct').textContent='';
  $('#r-left').textContent=fmtMS(R.total);
  $('#r-next').innerHTML=runDoneButtons();
  $('#r-play').textContent='▶';$('#r-bar').style.width='100%';$('#r-cur').style.left='100%';
  $('#r-zone').style.background='rgba(34,197,94,.2)';
  return;
 }
 const st=R.steps[R.idx],f=R.tStep/st.d,p=st.p0+(st.p1-st.p0)*f;
 $('#r-lab').textContent=st.on?`Esfuerzo ${st.rep}/${st.n}`:st.off?`Recuperación ${st.rep}/${st.n}`:(st.p1!==st.p0?'Rampa':'Bloque');
 $('#r-w').textContent=Math.round(p*ftp*((BT.connected&&BT.erg)?BT.mult:1));
 $('#r-pct').textContent=`${pc(p)}% FTP · Z${zoneOf(p)}${st.c?' · '+st.c+' rpm':''}`;
 $('#r-zone').style.background=ZC[zoneOf(p)]+'33';
 $('#r-left').textContent=fmtMS(Math.max(0,Math.ceil(st.d-R.tStep)));
 const nx=R.steps[R.idx+1];
 $('#r-next').textContent=nx?`Siguiente: ${Math.round(nx.p0*ftp)} W${nx.p1!==nx.p0?'→'+Math.round(nx.p1*ftp)+' W':''} · ${fmtMS(nx.d)}${nx.c?' · '+nx.c+' rpm':''}`:'Último tramo';
 $('#r-info').textContent=`Transcurrido ${fmtMS(R.t)} · restante ${fmtMS(Math.max(0,R.total-R.t))}`;
 $('#r-bar').style.width=(R.t/R.total*100)+'%';
 $('#r-cur').style.left=(R.t/R.total*100)+'%';
}
function runSkip(dir){
 if(!RUN||RUN.finished)return;
 const R=RUN;
 if(dir>0){R.t+=R.steps[R.idx].d-R.tStep;R.idx++;R.tStep=0;R.lastBeep=-1;if(R.idx>=R.steps.length){R.finished=true;R.running=false;R.t=R.total;}}
 else{
  if(R.tStep>3||R.idx===0){R.t-=R.tStep;R.tStep=0;}
  else{R.t-=R.tStep;R.idx--;R.t-=R.steps[R.idx].d;R.tStep=0;}
  R.lastBeep=-1;
 }
 R.last=performance.now();runUI();
}
function runClose(){
 if(RUN&&!RUN.saved&&RUN.samples.length>=300&&confirm('¿Guardar lo realizado hasta ahora?'))runSave();
 if(RUN&&!RUN.btStopped){RUN.btStopped=true;btRunStop();}
 if(RUN){clearInterval(RUN.timer);try{if(RUN.wl)RUN.wl.release();}catch(e){}try{if(RUN.ac)RUN.ac.close();}catch(e){}}
 RUN=null;$('#run').classList.add('hidden');$('#run').innerHTML='';
 if($('#modal').classList.contains('hidden'))document.body.classList.remove('noscroll');
}

function printPlan(){
 const p=S.plan;if(!p)return;
 const agg=p.weeks.map(w=>weekAgg(p,w));
 let h=`<h1>${esc(p.name)}</h1><div>${fmtDate(p.start,true)} → ${fmtDate(p.end,true)} · FTP ${S.profile.ftp} W · FC umbral ${S.profile.lthr}</div>`;
 h+=`<h2>Resumen por semanas</h2><table><tr><th>#</th><th>Lunes</th><th>Fase</th><th>Tipo</th><th>Horas</th><th>TSS</th></tr>${p.weeks.map((w,i)=>`<tr><td>${i+1}</td><td>${fmtDate(w.start)}</td><td>${w.phase}</td><td>${WT_NAME[w.type]}</td><td>${fmtH(agg[i].dur/3600)}</td><td>${Math.round(agg[i].tss)}</td></tr>`).join('')}</table>`;
 h+=`<h2>Sesiones</h2>`;
 p.weeks.forEach((w,i)=>{
  const rows=[];
  for(let d=0;d<7;d++){const date=addDays(w.start,d);(p.sessions[date]||[]).forEach(s=>{const inf=sInfo(s);rows.push(`<tr><td>${DOW3[d]} ${parseD(date).getDate()}/${parseD(date).getMonth()+1}</td><td>${esc(s.name)}</td><td>${inf.dur?fmtHM(inf.dur):''}</td><td>${Math.round(inf.tss)}</td></tr>`);});}
  h+=`<h2>Semana ${i+1} · ${w.phase} · ${WT_NAME[w.type]} (${fmtDate(w.start)})</h2><table><tr><th>Día</th><th>Sesión</th><th>Duración</th><th>TSS</th></tr>${rows.join('')||'<tr><td colspan="4">Descanso / libre</td></tr>'}</table>`;
 });
 $('#print').innerHTML=h;
 window.print();
}

  else if(scope==='next28'){a=t;b=addDays(t,27);}
  else{a=p.start;b=p.weeks[p.weeks.length-1].end;}
  const files=[],used=new Set();
  Object.keys(p.sessions).sort().forEach(date=>{
   if(date<a||date>b)return;
   p.sessions[date].forEach(s=>{
    if(!s.segs||!s.segs.length)return;
    const f=workoutFile(s,fmt,date);let n=f.name,k=2;
    while(used.has(n)){n=f.name.replace(/(\.[a-z]+)$/,`_${k}$1`);k++;}
    used.add(n);files.push({name:n,text:f.text,bytes:f.bytes});
   });
  });
  if(!files.length)return toast('No hay sesiones con estructura en ese rango');
  download(`entrenos_${fmt}_${a}.zip`,makeZip(files));toast(files.length+' entrenos en el ZIP');
 },
 resetAll:()=>{if(confirm('Se borrarán el perfil, eventos, plan y biblioteca personal. ¿Seguro?')){try{localStorage.removeItem(KEY);}catch(e){}S=defState();render();toast('Datos borrados');}},
 /* modo rodillo */
 runClose:()=>runClose(),
 runPlay:()=>runPlay(),
 runPrev:()=>runSkip(-1),
 runNext:()=>runSkip(1)
};

/* =====================================================================
   BLUETOOTH (Web Bluetooth + FTMS): control ERG de la bici y registro real
   Servicios: Fitness Machine 0x1826 (datos 0x2AD2, control 0x2AD9), Heart Rate 0x180D
   ===================================================================== */
const BT={dev:null,cp:null,ibd:null,connected:false,pending:null,q:Promise.resolve(),
 power:null,cad:null,hr:null,speed:null,hrDev:null,hrOn:false,hrName:'',name:'',
 mult:1,erg:true,lastTarget:null,lastTargetT:0,lastData:0,hrData:0};
const btSupported=()=>typeof navigator!=='undefined'&&!!navigator.bluetooth;

function parseIBD(dv){
 let o=0;const fl=dv.getUint16(o,true);o+=2;const r={};
 if(!(fl&1)){r.speed=dv.getUint16(o,true)/100;o+=2;}
 if(fl&2)o+=2;
 if(fl&4){r.cad=dv.getUint16(o,true)/2;o+=2;}
 if(fl&8)o+=2;
 if(fl&16)o+=3;
 if(fl&32)o+=2;
 if(fl&64){r.power=dv.getInt16(o,true);o+=2;}
 if(fl&128)o+=2;
 if(fl&256)o+=5;
 if(fl&512){r.hr=dv.getUint8(o);o+=1;}
 return r;
}
function btOnData(e){
 try{
  const r=parseIBD(e.target.value);
  if(r.power!=null)BT.power=Math.max(0,r.power);
  if(r.cad!=null)BT.cad=Math.round(r.cad);
  if(r.speed!=null)BT.speed=r.speed;
  if(r.hr!=null&&r.hr>0&&!BT.hrOn)BT.hr=r.hr;
  BT.lastData=Date.now();
 }catch(err){console.warn(err);}
}
function btOnCp(e){
 const v=e.target.value;
 if(v.byteLength>=3&&v.getUint8(0)===0x80&&BT.pending&&BT.pending.op===v.getUint8(1))BT.pending.res(v.getUint8(2));
}
/* cola de comandos: la bici no admite escrituras simultáneas */
function btCmd(bytes,timeout){
 if(!BT.cp||!BT.connected)return Promise.resolve(null);
 const run=()=>new Promise(res=>{
  const op=bytes[0];
  const timer=setTimeout(()=>{BT.pending=null;res(null);},timeout||2500);
  BT.pending={op,res:code=>{clearTimeout(timer);BT.pending=null;res(code);}};
  const v=Uint8Array.from(bytes);
  const w=BT.cp.writeValueWithResponse?BT.cp.writeValueWithResponse(v):BT.cp.writeValue(v);
  Promise.resolve(w).catch(err=>{clearTimeout(timer);BT.pending=null;console.warn(err);res(null);});
 });
 BT.q=BT.q.then(run,run);return BT.q;
}
function btSetTarget(w){return btCmd([0x05,w&255,(w>>8)&255],1200);}
async function btSetup(dev){
 dev.addEventListener('gattserverdisconnected',btOnDisc);
 const srv=await dev.gatt.connect();
 const svc=await srv.getPrimaryService(0x1826);
 BT.ibd=await svc.getCharacteristic(0x2AD2);
 BT.cp=await svc.getCharacteristic(0x2AD9);
 BT.ibd.addEventListener('characteristicvaluechanged',btOnData);
 BT.cp.addEventListener('characteristicvaluechanged',btOnCp);
 await BT.ibd.startNotifications();
 await BT.cp.startNotifications();
 BT.dev=dev;BT.connected=true;BT.name=dev.name||'Bici';BT.q=Promise.resolve();BT.lastTarget=null;
 const code=await btCmd([0x00]);
 if(code!==1&&code!==null)toast('La bici no concede el control de potencia (código '+code+'). Cierra otras apps conectadas a ella.');
 else if(code===null)toast('Conectada, pero no confirma el control ERG. Pruébalo con un tramo corto.');
 else toast('Conectada: '+BT.name);
}
async function btConnect(){
 if(!btSupported()){toast('Este navegador no soporta Web Bluetooth. Usa Chrome en Android/PC (o Bluefy en iPhone) con la app servida por HTTPS.');return;}
 try{
  if(BT.dev&&!BT.connected){try{await btSetup(BT.dev);btBar();return;}catch(e){/* reintento con selector */}}
  const dev=await navigator.bluetooth.requestDevice({filters:[{services:[0x1826]}],optionalServices:[0x180D,0x1818]});
  await btSetup(dev);btBar();
 }catch(e){
  if(e&&e.name==='NotFoundError')return;
  console.warn(e);toast('No se pudo conectar: '+(e&&e.message?e.message:e));btBar();
 }
}
function btOnDisc(){
 BT.connected=false;BT.power=null;BT.cad=null;BT.lastTarget=null;
 if(!BT.hrOn)BT.hr=null;
 toast('Bici desconectada. Pulsa «Conectar bici» para reconectar.');btBar();
}
function btDisconnect(){
 try{if(BT.dev&&BT.dev.gatt&&BT.dev.gatt.connected)BT.dev.gatt.disconnect();}catch(e){}
 BT.connected=false;BT.dev=null;BT.power=null;BT.cad=null;btBar();
}
async function btHrConnect(){
 if(!btSupported()){toast('Este navegador no soporta Web Bluetooth.');return;}
 try{
  const dev=await navigator.bluetooth.requestDevice({filters:[{services:[0x180D]}]});
  const srv=await dev.gatt.connect(),svc=await srv.getPrimaryService(0x180D),ch=await svc.getCharacteristic(0x2A37);
  ch.addEventListener('characteristicvaluechanged',e=>{
   const v=e.target.value,f=v.getUint8(0);BT.hr=(f&1)?v.getUint16(1,true):v.getUint8(1);BT.hrData=Date.now();
  });
  await ch.startNotifications();
  dev.addEventListener('gattserverdisconnected',()=>{BT.hrOn=false;BT.hr=null;toast('Pulsómetro desconectado');btBar();});
  BT.hrDev=dev;BT.hrOn=true;BT.hrName=dev.name||'Pulsómetro';toast('Pulsómetro conectado');btBar();
 }catch(e){if(!(e&&e.name==='NotFoundError')){console.warn(e);toast('No se pudo conectar el pulsómetro');}btBar();}
}

/* ---------- integración con el modo rodillo ---------- */
function btBar(){
 const el=$('#r-bt');if(!el)return;
 el.innerHTML=`<button class="btn s" data-a="btConn">${BT.connected?'✔ '+esc(BT.name):'🔗 Conectar bici'}</button>
 <button class="btn s" data-a="btHr">${BT.hrOn?'❤ '+esc(BT.hrName):'❤ Pulsómetro'}</button>
 ${BT.connected?`<button class="btn s" data-a="btMinus">−5%</button><b id="r-mult">${Math.round(BT.mult*100)}%</b><button class="btn s" data-a="btPlus">+5%</button><button class="btn s" data-a="btErg">ERG: ${BT.erg?'sí':'no'}</button>`:''}`;
}
function btLive(){
 const el=$('#r-live');if(!el)return;
 if(!BT.connected&&!BT.hrOn){el.textContent='';return;}
 const parts=[];
 if(BT.connected){parts.push(`<b style="color:var(--txt);font-size:20px">${BT.power!=null?BT.power:'–'} W</b>`);parts.push(`${BT.cad!=null?BT.cad:'–'} rpm`);}
 if(BT.hr!=null)parts.push(`${BT.hr} lpm`);
 el.innerHTML='Real: '+parts.join(' · ');
}
function btRunStart(){
 if(!BT.connected)return;
 BT.lastTarget=null;
 btCmd([0x00]);btCmd([0x07]);
}
function btRunPause(){if(BT.connected)btCmd([0x08,0x02]);}
function btRunStop(){if(BT.connected)btCmd([0x08,0x01]);}
function btTick(){
 const R=RUN;if(!R)return;
 if(R.finished){if(!R.btStopped){R.btStopped=true;btRunStop();}return;}
 if(!R.running)return;
 const sec=Math.floor(R.t);
 if(sec!==R.lastSec){
  R.lastSec=sec;
  if(BT.connected||BT.hrOn)R.samples.push({t:R.t0+R.samples.length,p:BT.connected?BT.power:null,cad:BT.connected?BT.cad:null,hr:BT.hr});
 }
 if(BT.connected&&BT.erg){
  const st=R.steps[R.idx];if(!st)return;
  const p=st.p0+(st.p1-st.p0)*(R.tStep/st.d),w=Math.max(0,Math.round(p*S.profile.ftp*BT.mult)),now=performance.now();
  if(w!==BT.lastTarget&&(R.sentIdx!==R.idx||now-BT.lastTargetT>900)){
   BT.lastTarget=w;BT.lastTargetT=now;R.sentIdx=R.idx;btSetTarget(w);
  }
 }
}
function runSave(){
 const R=RUN;if(!R||R.saved)return false;
 let a=null;
 if(R.samples.length>=60){try{a=analyzeRecs(R.samples);}catch(e){a=null;}}
 if(R.ref&&S.plan){
  const s=getSess(R.ref.date,R.ref.id);
  if(s){
   s.done=true;
   if(a)s.act={...(s.act||{}),...actFromA(a,'Rodillo (app)')};
   else{s.act=s.act||{};if(s.act.min==null)s.act.min=Math.round(R.total/60);}
   R.saved=true;save();return true;
  }
 }
 if(a&&S.plan){R.saved=true;placeActivity(a,'Rodillo (app)');save();return true;}
 return false;
}
function toTCX(samples,name){
 const t0=new Date(samples[0].t*1000).toISOString();
 const pts=samples.map(r=>`<Trackpoint><Time>${new Date(r.t*1000).toISOString()}</Time>${r.hr?`<HeartRateBpm><Value>${r.hr}</Value></HeartRateBpm>`:''}${r.cad!=null?`<Cadence>${r.cad}</Cadence>`:''}<Extensions><ns3:TPX><ns3:Watts>${r.p||0}</ns3:Watts></ns3:TPX></Extensions></Trackpoint>`).join('');
 return`<?xml version="1.0" encoding="UTF-8"?>\n<TrainingCenterDatabase xmlns="http://www.garmin.com/xmlschemas/TrainingCenterDatabase/v2" xmlns:ns3="http://www.garmin.com/xmlschemas/ActivityExtension/v2"><Activities><Activity Sport="Biking"><Id>${t0}</Id><Lap StartTime="${t0}"><TotalTimeSeconds>${samples.length}</TotalTimeSeconds><DistanceMeters>0</DistanceMeters><Calories>0</Calories><Intensity>Active</Intensity><TriggerMethod>Manual</TriggerMethod><Track>${pts}</Track></Lap><Notes>${xe(name)}</Notes></Activity></Activities></TrainingCenterDatabase>\n`;
}
function runDoneButtons(){
 const R=RUN;if(!R)return'';
 let h='';
 if(R.ref||R.samples.length>=60)h+=`<button class="btn pri" data-a="runDone">${R.samples.length>=60?'Guardar resultado real':'Marcar como hecha'}</button> `;
 if(R.samples.length>=60)h+=`<button class="btn" data-a="runTcx">Descargar .tcx</button>`;
 return h;
}

Object.assign(A,{
 btConn:()=>{if(BT.connected){if(confirm('¿Desconectar la bici?'))btDisconnect();}else btConnect();},
 btHr:()=>btHrConnect(),
 btMinus:()=>{BT.mult=Math.max(.5,Math.round((BT.mult-.05)*100)/100);BT.lastTarget=null;btBar();},
 btPlus:()=>{BT.mult=Math.min(1.5,Math.round((BT.mult+.05)*100)/100);BT.lastTarget=null;btBar();},
 btErg:()=>{BT.erg=!BT.erg;btBar();},
 runTcx:()=>{
  if(!RUN||RUN.samples.length<60)return;
  download(`rodillo_${iso(new Date(RUN.t0*1000))}.tcx`,toTCX(RUN.samples,RUN.s.name),'application/vnd.garmin.tcx+xml');
 },
 runDone:()=>{
  if(!RUN)return;
  const ok=runSave();
  const msg=ok?'Resultado guardado':'Sesión terminada';
  runClose();render();toast(msg);
 }
});
